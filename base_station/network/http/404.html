<!--
    The page lwIP's web server sends back automatically whenever a browser
    asks for a URL that does not exist on this device (see
    pico_set_lwip_httpd_content() in ../../CMakeLists.txt, which is what
    bakes this file into the program so lwIP can find it). The
    "http-equiv=refresh content=2" line tells the browser to reload the
    page automatically after 2 seconds, in case the person just mistyped
    the address and the correct page is only a moment away.
-->
<html>
<head>
    <title>IOT-Thermometer base station</title>
    <meta http-equiv="refresh" content="2">
</head>
<body>
    <h1>IOT-Thermometer base station</h1>
    <h2>404 - Page not found</h2>
    <p>Sorry, the page you are requesting was not found on this server. </p>
</body>
</html>
